services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secops_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - ENVIRONMENT=local

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secops_dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./data:/app/data
    environment:
      - API_BASE_URL=http://api:8000
