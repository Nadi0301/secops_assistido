version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: secops_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - ENVIRONMENT=local

  dashboard:
    build:
      context: .
      dockerfile: src/dashboard/Dockerfile
    container_name: secops_dashboard
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
